name: soundcloud release

# Builds Sonora with SoundCloud for Linux and Windows and publishes both as one release. A tag
# such as v0.47.0-soundcloud.5 starts it, and that version is what the build reports, so the
# app's updater can tell a newer SoundCloud build from the one it runs.

on:
  push:
    tags: ["v*-soundcloud.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build and publish, such as v0.47.0-soundcloud.5
        required: true

concurrency:
  group: soundcloud-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: version
        id: meta
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: build
        shell: bash
        env:
          SONORA_VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package sonora --target "$TARGET"

      - name: package for Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --owner=0 --group=0 --numeric-owner -czf dist/sonora-soundcloud-x86_64-linux.tar.gz \
            -C "target/$TARGET/release" sonora

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          SONORA_VERSION: ${{ steps.meta.outputs.version }}
          SONORA_ARCH: x64compatible
          SONORA_SETUP: Sonora-SoundCloud-Setup
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:TARGET/release/sonora.exe" "dist/sonora-soundcloud-x86_64-windows.exe"
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Sonora with SoundCloud ${TAG#v}" \
            --notes-file .github/soundcloud-release.md
